<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing — jonIAs</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-titulo">
      <span class="logo-dot"></span>
      <h1>jon<span class="grad">IA</span>s</h1>
      <span class="subtitulo">marketing</span>
    </div>
    <div class="topo-acoes">
      <a href="/central" class="btn-topo">🗄 Central</a>
      <a href="/aulas" class="btn-topo">🎓 Minhas Aulas</a>
      <button id="btn-sair" class="btn-topo">Sair ⎋</button>
    </div>
  </header>

  <main class="pagina-lista mk-pagina">
    <nav class="mk-abas" aria-label="Frentes do marketing">
      <button type="button" class="mk-aba" data-aba="emails">✉ E-mail marketing <span class="mk-aba-alerta" id="alerta-emails"></span></button>
      <button type="button" class="mk-aba" data-aba="ads">📢 Campanhas de ADS <span class="mk-aba-alerta" id="alerta-ads"></span></button>
      <button type="button" class="mk-aba" data-aba="whatsapp">💬 Grupos de WhatsApp <span class="mk-aba-alerta" id="alerta-whatsapp"></span></button>
      <button type="button" class="mk-aba" data-aba="planner">🗓 Planner de conteúdo <span class="mk-aba-alerta" id="alerta-planner"></span></button>
    </nav>
    <div id="mk-tv" class="mk-tv-barra so-admin-mk"></div>

    <!-- ================= E-MAIL ================= -->
    <section id="aba-emails" class="mk-secao oculto">
      <p class="texto-suave" id="mk-intro">carregando…</p>
      <div class="grade-metricas" id="mk-resumo"></div>

      <div class="mk-controles">
        <div class="mk-filtro" role="tablist">
          <button type="button" class="btn-mini ativo" data-visao="pendencias">Pendências</button>
          <button type="button" class="btn-mini" data-visao="turmas">Por turma (histórico)</button>
        </div>
        <span class="texto-suave" id="mk-legenda"></span>
      </div>
      <div id="mk-lista"></div>
      <div id="mk-excluidas"></div>

      <section id="mk-admin" class="oculto">
        <h3 class="secao-titulo">Regra de antecedência (admin)</h3>
        <div class="mk-controles">
          <label class="texto-suave">30/15/7 dias antes até a véspera de
            <input type="date" id="mk-virada" class="campo-select" />; desse dia em diante, 60/30/15.</label>
          <button type="button" class="btn-mini" id="mk-virada-salvar">Salvar</button>
        </div>
        <p class="texto-suave">Cada envio guarda a regra do dia em que nasceu: mudar a data só afeta as turmas que ainda vão entrar.</p>
      </section>
    </section>

    <!-- ================= ADS ================= -->
    <section id="aba-ads" class="mk-secao oculto">
      <div class="mk-ads-topo" id="ads-topo">carregando…</div>
      <div class="mk-ads-grade" id="ads-slots"></div>
      <h3 class="secao-titulo">Histórico de campanhas por setor</h3>
      <div id="ads-historico"></div>
    </section>

    <!-- ================= WHATSAPP ================= -->
    <section id="aba-whatsapp" class="mk-secao oculto">
      <div id="wa-atual" class="mk-wa-atual">carregando…</div>
      <div class="grade-metricas" id="wa-resumo"></div>
      <h3 class="secao-titulo">Semanas</h3>
      <div id="wa-historico"></div>
    </section>
    <!-- ================= PLANNER (migração 41; js/planner.js) ================= -->
    <section id="aba-planner" class="mk-secao oculto">
      <div class="grade-metricas" id="pl-kpis">carregando…</div>
      <nav class="mk-filtro pl-visoes" id="pl-visoes">
        <button type="button" class="btn-mini ativo" data-pl-visao="calendario">Calendário</button>
        <button type="button" class="btn-mini" data-pl-visao="semana">Rotina e fechamento</button>
        <button type="button" class="btn-mini" data-pl-visao="desempenho">Desempenho por formato</button>
        <button type="button" class="btn-mini so-admin-mk" data-pl-visao="vinculos">Turmas dos posts <span class="mk-aba-alerta" id="pl-alerta-vinculos"></span></button>
        <button type="button" class="btn-mini so-admin-mk" data-pl-visao="importar">Importar planilha</button>
      </nav>
      <div id="pl-conteudo"></div>
    </section>
  </main>

  <dialog id="pl-dlg" class="pl-dlg" aria-labelledby="pl-dlg-titulo"></dialog>

  <div id="aviso" class="aviso" role="status"></div>
  <script src="/js/nav.js"></script>
  <script src="/js/marketing.js"></script>
  <script src="/js/planner.js"></script>
</body>
</html>
